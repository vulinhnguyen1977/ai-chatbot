# Middle School Maths & Physics Tutor -- configuration
#
# Every setting can also be supplied through an environment variable, which
# takes precedence over this file. The variable name is MSTUTOR_ + the key in
# upper case with dots replaced by underscores:
#
#     mail.password  ->  MSTUTOR_MAIL_PASSWORD
#
# Put secrets in the environment, not in this file -- this file travels inside
# the shipped zip.
#
# The application works with this file untouched. Nothing here needs editing
# before first run.

[db]
path = data/mstutor.db

# ---------------------------------------------------------------- runtime
# The bundled inference engine and weights, both under runtime/. Nothing has to
# be installed on the machine.
[runtime]
# Pins the model and REMOVES the Answer style dropdown from the window. Leave
# this commented out unless you want to take the choice away from the user.
# chat_model = qwen3-1.7b.gguf

# Used to search ingested textbooks. Without it, retrieval falls back to
# keyword matching, which still works.
embed_model = nomic-embed-text.gguf

# auto | vulkan | cpu
# "auto" prefers the Vulkan build (Intel, AMD and NVIDIA GPUs) and falls back to
# CPU automatically when there is no usable driver.
accelerator = auto

# Layers to offload to the GPU. 99 means "all of them"; ignored on CPU.
gpu_layers = 99

# CPU threads. 0 lets the engine decide.
threads = 0

# How long to wait for the model to load before giving up. Reading several
# gigabytes off a slow disk on first run can take a while.
startup_timeout_s = 300

# ------------------------------------------------------- answer style
# The two choices offered by the "Answer style" dropdown in the window. Each
# names a file in runtime/models; a preset whose file is missing is simply not
# offered, and the dropdown is hidden entirely if fewer than two remain.
#
# Switching restarts the model server, which takes a few seconds. The choice is
# remembered per account.
[presets]
fast  = qwen3-1.7b.gguf
smart = qwen3-4b.gguf

# Which one a brand new account starts on: fast | smart
default = smart

# ------------------------------------------------------------------- model
[llm]
# llamacpp (bundled, the default) or ollama (talk to an existing Ollama daemon).
backend = llamacpp

# Only used when the bundled runtime is unavailable, or backend = ollama.
# Normally ignored: the runtime reports the port it actually bound.
# url = http://127.0.0.1:11434

# Low temperature: this is arithmetic, not creative writing.
temperature = 0.2
num_ctx     = 8192
timeout_s   = 600

# Reasoning control. Leave unset to use the model's own default.
#
# Do NOT set this to false on a Qwen3 model. With reasoning on, the engine keeps
# it in a separate field and the answer stays clean; with it off, the model
# writes its reasoning into the answer instead. Use a smaller model for speed.
#
# think = low

# These names only matter with backend = ollama.
model       = mstutor
embed_model = nomic-embed-text

# -------------------------------------------------------------------- auth
[auth]
# Requirement: a session is force-expired 180 days after it is issued. This is
# an absolute cap measured from sign-in; nothing extends it, including the
# "keep me signed in" option below.
session_days      = 180
require_2fa       = true

# "Keep me signed in on this device". The session token is stored in
# data/remember.bin, encrypted with the Windows Data Protection API so it is
# readable only by this Windows account on this machine, and rotated on every
# launch. Set to false to remove the checkbox and always require a sign-in.
remember_enabled  = true

# Idle timeout for a stored sign-in: unused for this many days and the user has
# to sign in again. 30 days is the usual ceiling for a "remember me" token.
# Lower it on a shared machine.
remember_days     = 30
code_ttl_minutes  = 10
max_code_attempts = 5
max_failed_logins = 8
lockout_minutes   = 15

# -------------------------------------------------------------------- mail
[mail]
# "file" writes each message to mail.outbox_dir as a .eml instead of sending.
# This lets the whole 2FA flow be used before any mailbox is configured: open
# the newest .eml in data/outbox to read the code.
transport  = file
outbox_dir = data/outbox

# --- real delivery -------------------------------------------------------
# Gmail: use an App Password (Google Account > Security > 2-Step Verification
# > App passwords), not the account password.
#   host = smtp.gmail.com       port = 587   security = starttls
# Microsoft 365:
#   host = smtp.office365.com   port = 587   security = starttls
# security may be: starttls | implicit | none
host      = smtp.gmail.com
port      = 587
security  = starttls
username  =
# password  =   <-- prefer:  set MSTUTOR_MAIL_PASSWORD=...
from      =
from_name = Middle School Tutor

# --------------------------------------------------------------- retrieval
[rag]
# Search over ingested textbooks. Harmless when no textbooks are loaded.
enabled   = true
top_k     = 4
min_score = 0.35

# -------------------------------------------------------------- topic gate
[guard]
# When true, questions the fast lexical gate cannot settle are classified by
# the model. Set to false on very slow machines: ambiguous questions are then
# refused rather than escalated.
use_model = true

# -------------------------------------------------------------------- chat
[chat]
# How many previous exchanges are replayed to the model for context.
history_turns = 8
